
name: Build Ambiorix Pay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android project
        shell: bash
        run: |
          echo "Repository contents:"
          ls -la

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "AmbiorixPay-Android-Project/settings.gradle.kts" ] || [ -f "AmbiorixPay-Android-Project/settings.gradle" ]; then
            echo "PROJECT_DIR=AmbiorixPay-Android-Project" >> "$GITHUB_ENV"
          else
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts"
            find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \)
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
